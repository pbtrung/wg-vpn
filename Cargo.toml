[workspace]
resolver = "2"
members = ["wg-common", "wg-server", "wg-client"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/pbtrung/wg-vpn"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "io-util"] }
clap = { version = "4.6.6", features = ["derive"] }
base64 = "0.23.1"
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
getrandom = "0.4.3"
ipnet = "2.12.2"
url = "2.5.8"
hostname = "0.4.2"
fd-lock = "4.0.4"
aws-sdk-s3 = "1.145.0"
aws-config = "1.12.0"

wg-common = { path = "wg-common" }
