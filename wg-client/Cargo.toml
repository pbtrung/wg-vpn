[package]
name = "wg-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
wg-common = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-runtime-api = "1"
hostname = { workspace = true }
fd-lock = { workspace = true }
ipnet = { workspace = true }
libc = "0.2"
# Configures the kernel WireGuard interface (keys/peers) directly over
# netlink/UAPI, the way innernet does -- no wg/wg-quick subprocess. See
# NOTICE.md: wireguard-control is LGPL-2.1-or-later, unlike the rest of
# this workspace's MIT code.
#
# Git-pinned rather than crates.io: the published wireguard-control/
# netlink-request 2.0.0 releases are frozen on an older netlink-packet-*
# snapshot (route 0.21/core 0.7) that predates innernet's own "Update the
# netlink ecosystem to latest versions" commit -- that upgrade hasn't
# been re-published to crates.io as a new version. Pinning to that commit
# gets the same netlink-packet-route/core innernet's own main branch
# builds against today. Re-pin `rev` by hand if innernet cuts a real
# crates.io release with this upgrade, or moves main further.
wireguard-control = { git = "https://github.com/tonarino/innernet", rev = "1ba6154b6ebacd68dfe79c3a4f6273fd3e8dea35" }
# Address/link/route management -- the part of "how innernet does it"
# that wireguard-control itself doesn't cover. MIT-licensed, from the
# same upstream project and the same pinned commit (must match
# wireguard-control's rev so both resolve the same netlink-packet-route
# types -- see the netlink-packet-* versions below).
netlink-request = { git = "https://github.com/tonarino/innernet", rev = "1ba6154b6ebacd68dfe79c3a4f6273fd3e8dea35" }
netlink-packet-core = "0.8"
netlink-packet-route = "0.31"
