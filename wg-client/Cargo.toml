[package]
name = "wg-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
wg-common = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-runtime-api = "1"
hostname = { workspace = true }
fd-lock = { workspace = true }
ipnet = { workspace = true }
libc = "0.2"
# Configures the kernel WireGuard interface (keys/peers) directly over
# netlink/UAPI, the way innernet does -- no wg/wg-quick subprocess. See
# NOTICE.md: wireguard-control is LGPL-2.1-or-later, unlike the rest of
# this workspace's MIT code.
wireguard-control = "2.0.0"
# Address/link/route management -- the part of "how innernet does it"
# that wireguard-control itself doesn't cover. MIT-licensed, from the
# same upstream project.
# Pinned to match what netlink-request/wireguard-control 2.0.0 actually
# depend on (checked via `cargo tree -i`) -- these are 0.x crates, so a
# mismatched minor version here would silently produce a *different*,
# type-incompatible RouteNetlinkMessage and fail to compile against
# netlink_request::netlink_request_rtnl.
netlink-request = "2.0.0"
netlink-packet-core = "0.7"
netlink-packet-route = "0.21"
